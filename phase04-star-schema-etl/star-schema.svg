<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">NorthStar Retail implemented sales star schema</title>
  <desc id="desc">The FACT_SALES table is at one row per sales order line and connects to DIM_DATE, DIM_CUSTOMER, DIM_PRODUCT, DIM_STORE, and DIM_PROMOTION.</desc>
  <rect width="1400" height="850" rx="26" fill="#f3f6fb"/>
  <text x="60" y="72" fill="#18324b" font-family="Arial, sans-serif" font-size="38" font-weight="700">NorthStar Retail | Implemented Sales Star Schema</text>
  <text x="62" y="112" fill="#5e7185" font-family="Arial, sans-serif" font-size="21">Snowflake target documented in Lab 4 · fact grain: one sales order line</text>
  <g stroke="#91a4b7" stroke-width="4">
    <path d="M700 340L700 260"/><path d="M590 380L390 260"/><path d="M810 380L1010 260"/>
    <path d="M590 490L390 600"/><path d="M810 490L1010 600"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="560" y="370" width="280" height="150" rx="22" fill="#18324b" stroke="#18324b" stroke-width="3"/>
    <text x="700" y="416" fill="#9ec9ff" font-size="18" font-weight="700">TRANSACTION FACT</text>
    <text x="700" y="460" fill="#ffffff" font-size="30" font-weight="700">FACT_SALES</text>
    <text x="700" y="493" fill="#d2dfed" font-size="18">One row per order line</text>
    <rect x="560" y="160" width="280" height="100" rx="18" fill="#e7f5f2" stroke="#13877f" stroke-width="3"/>
    <text x="700" y="202" fill="#116e68" font-size="25" font-weight="700">DIM_DATE</text>
    <text x="700" y="234" fill="#526477" font-size="17">DATE_KEY · calendar attributes</text>
    <rect x="110" y="160" width="280" height="100" rx="18" fill="#e7f5f2" stroke="#13877f" stroke-width="3"/>
    <text x="250" y="202" fill="#116e68" font-size="25" font-weight="700">DIM_CUSTOMER</text>
    <text x="250" y="234" fill="#526477" font-size="17">CUSTOMER_SK · SCD Type 2</text>
    <rect x="1010" y="160" width="280" height="100" rx="18" fill="#e7f5f2" stroke="#13877f" stroke-width="3"/>
    <text x="1150" y="202" fill="#116e68" font-size="25" font-weight="700">DIM_PRODUCT</text>
    <text x="1150" y="234" fill="#526477" font-size="17">PRODUCT_SK · product, category, cost</text>
    <rect x="110" y="600" width="280" height="100" rx="18" fill="#e7f5f2" stroke="#13877f" stroke-width="3"/>
    <text x="250" y="642" fill="#116e68" font-size="25" font-weight="700">DIM_STORE</text>
    <text x="250" y="674" fill="#526477" font-size="17">STORE_SK · region, channel</text>
    <rect x="1010" y="600" width="280" height="100" rx="18" fill="#e7f5f2" stroke="#13877f" stroke-width="3"/>
    <text x="1150" y="642" fill="#116e68" font-size="25" font-weight="700">DIM_PROMOTION</text>
    <text x="1150" y="674" fill="#526477" font-size="17">PROMOTION_SK · default key 0</text>
  </g>
  <rect x="110" y="755" width="1180" height="54" rx="14" fill="#fff4dc"/>
  <text x="140" y="790" fill="#805b14" font-family="Arial, sans-serif" font-size="19">Measures: EXTENDED_SALES = quantity × unit price · EXTENDED_COST = quantity × unit cost · MARGIN_AMOUNT = sales − cost</text>
</svg>
