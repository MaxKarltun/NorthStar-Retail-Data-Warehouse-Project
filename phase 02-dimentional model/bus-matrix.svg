<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">NorthStar Retail Kimball bus matrix</title>
  <desc id="desc">Sales and Returns use Date, Customer, Product, Store, and Promotion. Future Inventory uses Date, Product, and Store.</desc>
  <rect width="1200" height="650" rx="28" fill="#f3f6fb"/>
  <text x="60" y="78" fill="#18324b" font-family="Arial, sans-serif" font-size="38" font-weight="700">NorthStar Retail | Kimball Bus Matrix</text>
  <text x="62" y="119" fill="#5e7185" font-family="Arial, sans-serif" font-size="21">Business processes aligned to conformed dimensions</text>
  <rect x="60" y="165" width="1080" height="350" rx="18" fill="#ffffff" stroke="#d5dfea" stroke-width="2"/>
  <path d="M60 245h1080M60 335h1080M60 425h1080M350 165v350M508 165v350M666 165v350M824 165v350M982 165v350" stroke="#d5dfea" stroke-width="2"/>
  <rect x="60" y="165" width="290" height="80" rx="18" fill="#18324b"/>
  <rect x="332" y="165" width="18" height="80" fill="#18324b"/>
  <rect x="350" y="165" width="790" height="80" rx="18" fill="#18324b"/>
  <text x="88" y="215" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Business process</text>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="429" y="215">Date</text><text x="587" y="215">Customer</text>
    <text x="745" y="215">Product</text><text x="903" y="215">Store</text>
    <text x="1061" y="215">Promotion</text>
  </g>
  <g fill="#25364a" font-family="Arial, sans-serif" font-size="23">
    <text x="88" y="301">Sales</text><text x="88" y="391">Returns</text>
    <text x="88" y="481">Future Inventory</text>
  </g>
  <g fill="#13877f" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <text x="429" y="302">✓</text><text x="587" y="302">✓</text><text x="745" y="302">✓</text><text x="903" y="302">✓</text><text x="1061" y="302">✓</text>
    <text x="429" y="392">✓</text><text x="587" y="392">✓</text><text x="745" y="392">✓</text><text x="903" y="392">✓</text><text x="1061" y="392">✓</text>
    <text x="429" y="482">✓</text><text x="745" y="482">✓</text><text x="903" y="482">✓</text>
  </g>
  <g fill="#9aa9b8" font-family="Arial, sans-serif" font-size="26" text-anchor="middle">
    <text x="587" y="482">—</text><text x="1061" y="482">—</text>
  </g>
  <rect x="60" y="550" width="1080" height="58" rx="14" fill="#e7f5f2"/>
  <text x="84" y="586" fill="#17675f" font-family="Arial, sans-serif" font-size="19">Inventory is future scope: source inventory and reorder data are not available in the provided dataset.</text>
</svg>
