<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">NorthStar Retail proposed dimensional model</title>
  <desc id="desc">Sales and Returns transaction facts share Date, Customer, Product, Store, and Promotion dimensions. Future Inventory periodic snapshots share Date, Product, and Store.</desc>
  <rect width="1400" height="780" rx="28" fill="#f3f6fb"/>
  <text x="60" y="72" fill="#18324b" font-family="Arial, sans-serif" font-size="38" font-weight="700">NorthStar Retail | Proposed Star Schemas</text>
  <text x="62" y="112" fill="#5e7185" font-family="Arial, sans-serif" font-size="21">Conformed dimensions support consistent analysis across business processes</text>

  <g stroke="#91a4b7" stroke-width="3" fill="none">
    <path d="M170 220L280 420M410 220L420 420M650 220L560 420M890 220L700 420M1130 220L840 420"/>
    <path d="M170 220L280 545M410 220L420 545M650 220L560 545M890 220L700 545M1130 220L840 545"/>
    <path d="M170 220L280 670M650 220L560 670M890 220L700 670"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="75" y="150" width="190" height="76" rx="16" fill="#e7f5f2" stroke="#13877f" stroke-width="3"/>
      <text x="170" y="197" fill="#116e68" font-size="24" font-weight="700">DimDate</text>
      <rect x="315" y="150" width="190" height="76" rx="16" fill="#e7f5f2" stroke="#13877f" stroke-width="3"/>
      <text x="410" y="197" fill="#116e68" font-size="24" font-weight="700">DimCustomer</text>
      <rect x="555" y="150" width="190" height="76" rx="16" fill="#e7f5f2" stroke="#13877f" stroke-width="3"/>
      <text x="650" y="197" fill="#116e68" font-size="24" font-weight="700">DimProduct</text>
      <rect x="795" y="150" width="190" height="76" rx="16" fill="#e7f5f2" stroke="#13877f" stroke-width="3"/>
      <text x="890" y="197" fill="#116e68" font-size="24" font-weight="700">DimStore</text>
      <rect x="1035" y="150" width="190" height="76" rx="16" fill="#e7f5f2" stroke="#13877f" stroke-width="3"/>
      <text x="1130" y="197" fill="#116e68" font-size="24" font-weight="700">DimPromotion</text>
    </g>

    <g>
      <rect x="215" y="385" width="250" height="74" rx="16" fill="#eaf2fe" stroke="#3478c8" stroke-width="3"/>
      <text x="340" y="431" fill="#285f9e" font-size="25" font-weight="700">FactSales</text>
      <text x="1275" y="431" fill="#526477" font-size="18" text-anchor="end">Transaction fact</text>
      <rect x="215" y="510" width="250" height="74" rx="16" fill="#eaf2fe" stroke="#3478c8" stroke-width="3"/>
      <text x="340" y="556" fill="#285f9e" font-size="25" font-weight="700">FactReturns</text>
      <text x="1275" y="556" fill="#526477" font-size="18" text-anchor="end">Transaction fact</text>
      <rect x="215" y="635" width="250" height="74" rx="16" fill="#fff4dc" stroke="#c68a1b" stroke-width="3" stroke-dasharray="8 6"/>
      <text x="340" y="681" fill="#805b14" font-size="25" font-weight="700">FactInventory</text>
      <text x="1275" y="681" fill="#805b14" font-size="18" text-anchor="end">Future periodic snapshot: one product × store × day</text>
    </g>
  </g>

  <rect x="60" y="728" width="1280" height="34" rx="12" fill="#fff4dc"/>
  <text x="78" y="752" fill="#805b14" font-family="Arial, sans-serif" font-size="17">Inventory is future scope. Return rows use the original sale's promotion when that source relationship is available.</text>
</svg>
